publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.0
  drift: ^2.35.0
  drift_flutter: ^0.3.0
  go_router: ^18.0.0
