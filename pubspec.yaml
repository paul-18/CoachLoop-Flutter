  wakelock_plus: ^1.8.0
  uuid: ^4.6.0
  intl: ^0.20.2
  collection: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
